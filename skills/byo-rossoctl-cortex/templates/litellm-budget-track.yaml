# rossoctl cortex — per-agent LiteLLM budget tracking pipeline.
#
# Run (each agent gets its own ledger via CORTEX_SPEND_FILE):
#   CORTEX_CA_DIR="$PWD/.cortex/tls-bridge-ca" \
#   CORTEX_SPEND_FILE="$PWD/.cortex/spend-alpha.json" CORTEX_MAX_BUDGET=5.00 \
#     rossoctl authbridge exec --config THIS_FILE.yaml \
#       --instanceName alpha --sessionServer "" -- claude -p "…"
#
# Inspect the pipeline log in another window:
#   tail -f /tmp/authbridge.log
#
mode: proxy-sidecar

listener:
  roles: [forward]                 # egress-only: intercept the command's own outbound HTTPS
  forward_proxy_addr: "localhost:0"  # 0 = kernel picks a free port; exec injects it as HTTPS_PROXY

# Terminate the command's outbound TLS so the outbound pipeline sees decrypted
# HTTP(S) — required for any plugin that reads request/response headers or bodies.
tls_bridge:
  mode: enabled
  ca_dir: "${CORTEX_CA_DIR}"                         # export to an ABSOLUTE, persistent, writable dir
                                                     #   (e.g. CORTEX_CA_DIR="$PWD/.cortex/tls-bridge-ca").
                                                     #   MUST persist across runs or clients re-trust a new CA each time.
  generate_ca: true                                 # mint a self-signed CA into ca_dir if absent
  ports: [443, 8443]                                # HTTPS ports to intercept (covers LLM endpoints)
  # upstream_ca_bundle: /path/to/roots.pem          # extra roots if the LLM endpoint uses a private CA

pipeline:
  outbound:                        # the forward proxy runs the OUTBOUND pipeline
    plugins:
      - name: litellm-budget-track
        config:
          spend_file: "${CORTEX_SPEND_FILE}"   # per-agent JSON ledger; env-var driven => isolated per agent
          max_budget: ${CORTEX_MAX_BUDGET}     # daily budget in USD; 429 once exceeded (resets midnight UTC)
          # Per-token rates. REQUIRED for Claude Code and any stream:true client:
          # streamed /v1/messages responses report cost 0 in the header, so without
          # these a streamed call records $0. They are ignored for non-streaming
          # responses (the response header cost wins), so leaving them set is safe.
          # These are EXAMPLE rates — replace with your model's real per-token prices.
          # Requires the streaming-enhanced plugin (aslom/cortex@fix_streaming_litellm_plugin).
          input_cost_per_token: 0.000003       # example: $3 / 1M UNCACHED input tokens
          output_cost_per_token: 0.000015      # example: $15 / 1M output tokens
          # Prompt-cache tiers (Claude Code caches heavily). A cache WRITE costs a
          # premium and a cache READ a steep discount, so pricing them at the flat
          # input rate overstates cache-heavy traffic up to ~10× and trips the 429
          # far too early. Set to your provider's real cache prices. If omitted, each
          # defaults to input_cost_per_token (flat — the overstating behavior).
          cache_write_cost_per_token: 0.00000375   # example: $3.75 / 1M (write premium)
          cache_read_cost_per_token: 0.0000003     # example: $0.30 / 1M (read discount)
      # Add more outbound plugins here, e.g.:
      # - name: inference-parser
      # - name: ibac
      #   config: { judge_endpoint: "http://localhost:11434", judge_model: "llama3" }
